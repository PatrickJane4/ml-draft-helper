name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JDK 17 & Android SDK
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip curl wget

          JDK17_DIR="/usr/lib/jvm/java-17-openjdk-amd64"
          if [ ! -d "$JDK17_DIR" ]; then
            JDK17_DIR=$(find /usr/lib/jvm -maxdepth 1 -type d -name "*17*" | head -n 1)
          fi

          echo "Using JDK17_DIR=$JDK17_DIR"
          echo "JAVA_HOME=$JDK17_DIR" >> $GITHUB_ENV
          echo "$JDK17_DIR/bin" >> $GITHUB_PATH
          export JAVA_HOME="$JDK17_DIR"
          export PATH="$JDK17_DIR/bin:$PATH"
          java -version

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools/latest

          CMDLINE_ZIP=/tmp/commandlinetools.zip
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O $CMDLINE_ZIP
          unzip -q $CMDLINE_ZIP -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf $CMDLINE_ZIP /tmp/cmdline-tools-extract

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle Wrapper
        run: |
          set -e
          GRADLE_VERSION="8.7"
          if [ ! -f "./gradlew" ]; then
            curl -fSL --retry 3 --retry-delay 2 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-all.zip" \
              -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            "/tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
              --gradle-version "${GRADLE_VERSION}" \
              --distribution-type all \
              --no-daemon
            rm -rf /tmp/gradle.zip /tmp/gradle
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          set -e
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-helper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
